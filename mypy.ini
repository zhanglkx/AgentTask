[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
check_untyped_defs = True
no_implicit_reexport = True
show_error_codes = True
pretty = True

# src-layout 多 workspace 包,需要 namespace_packages + explicit_package_bases
# 才能正确区分各包的同名文件（如多个 conftest.py）。
namespace_packages = True
explicit_package_bases = True
mypy_path = packages/common/src:packages/llm_providers/src

# 排除目录
exclude = (?x)(\.venv/|build/|dist/|site/|\.ipynb_checkpoints/)

# lessons 章节放宽（教学代码不强制 strict）
# 注意: lesson 目录名使用短横线（如 lessons/01-foundations）,不是合法 Python 模块名,
# 所以 [mypy-lessons.*] 实际匹配的是后续可能添加的合法子模块。教学代码主要靠
# ruff 的 per-file-ignores 与 mypy 的 exclude 配合放宽。
[mypy-lessons.*]
disallow_untyped_defs = False
strict = False

# 第三方库类型存根缺失时忽略
[mypy-langgraph.*]
ignore_missing_imports = True

[mypy-langchain.*]
ignore_missing_imports = True

[mypy-langchain_core.*]
ignore_missing_imports = True

[mypy-langchain_openai.*]
ignore_missing_imports = True

[mypy-langchain_anthropic.*]
ignore_missing_imports = True

[mypy-langchain_community.*]
ignore_missing_imports = True

[mypy-qdrant_client.*]
ignore_missing_imports = True

[mypy-tavily.*]
ignore_missing_imports = True

[mypy-trafilatura.*]
ignore_missing_imports = True

[mypy-readability.*]
ignore_missing_imports = True

[mypy-e2b.*]
ignore_missing_imports = True

[mypy-mcp.*]
ignore_missing_imports = True
